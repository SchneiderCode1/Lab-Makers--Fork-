name: CI/CD Pipeline - Semana 5

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permissões necessárias para publicar pacotes no GHCR
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # TRILHA DO BACKEND (Django)
  # ==========================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Semana-5/backend/requirements.txt

      - name: Instalar dependências de Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Executar Lint (Flake8)
        run: |
          flake8 Semana-5/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 Semana-5/backend --count --max-line-length=127 --statistics

  build-backend:
    name: Build Container Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Build da Imagem Docker DEV
        run: |
          docker build -t backend-dev Semana-5/backend/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Semana-5/backend/requirements.txt

      - name: Instalar dependências
        run: |
          cd Semana-5/backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Testes do Django
        run: |
          cd Semana-5/backend/Semana5e6
          python manage.py test

  deploy-backend:
    name: Publicar Imagem Backend no GHCR
    runs-on: ubuntu-latest
    needs: test-backend # Executa apenas se os testes do backend passarem
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build e Push da Imagem de Produção
        uses: docker/build-push-action@v5
        with:
          context: ./Semana-5/backend
          file: ./Semana-5/backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ==========================================
  # TRILHA DO FRONTEND (Next.js)
  # ==========================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Semana-5/frontend/my-app/package-lock.json

      - name: Instalar dependências
        run: |
          cd Semana-5/frontend/my-app
          npm ci

      - name: Executar Lint (ESLint)
        run: |
          cd Semana-5/frontend/my-app
          npm run lint --if-present

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Semana-5/frontend/my-app/package-lock.json

      - name: Instalar dependências
        run: |
          cd Semana-5/frontend/my-app
          npm ci

      - name: Executar Build do Next.js
        run: |
          cd Semana-5/frontend/my-app
          npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Semana-5/frontend/my-app/package-lock.json

      - name: Instalar dependências
        run: |
          cd Semana-5/frontend/my-app
          npm ci

      - name: Executar Testes Frontend
        run: |
          cd Semana-5/frontend/my-app
          npm test --if-present

  deploy-frontend:
    name: Publicar Imagem Frontend no GHCR
    runs-on: ubuntu-latest
    needs: test-frontend # Executa apenas se os testes do frontend passarem
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build e Push da Imagem de Produção
        uses: docker/build-push-action@v5
        with:
          context: ./Semana-5/frontend
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}